services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-estateflow}
      MYSQL_USER: ${DB_USER:-estate_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-estate_password}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - estate_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${DB_USER:-estate_user} -p${DB_PASSWORD:-estate_password} >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5001}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-estate_user}
      DB_PASSWORD: ${DB_PASSWORD:-estate_password}
      DB_NAME: ${DB_NAME:-estateflow}
      PORT: 5000
      NODE_ENV: production
    networks:
      - estate_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --timeout=5 --tries=1 http://localhost:5000/api/health >/dev/null 2>&1 || curl -fs http://localhost:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
    networks:
      - estate_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --timeout=5 --tries=1 http://localhost:80/ >/dev/null 2>&1 || curl -fs http://localhost:80/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - estate_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --timeout=5 --tries=1 http://localhost:9090/-/healthy >/dev/null 2>&1 || curl -fs http://localhost:9090/-/healthy >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: 'grafana-clock-panel,grafana-simple-json-datasource'
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - estate_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --timeout=5 --tries=1 http://localhost:3000/api/health >/dev/null 2>&1 || curl -fs http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  estate_network:

volumes:
  mysql_data:
  prometheus_data:
  grafana_data: