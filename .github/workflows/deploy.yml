name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/estate-flow-backend:${{ github.run_number }}
          ${{ secrets.DOCKER_USERNAME }}/estate-flow-backend:latest

    - name: Build Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/estate-flow-frontend:${{ github.run_number }}
          ${{ secrets.DOCKER_USERNAME }}/estate-flow-frontend:latest

    - name: Update Kubernetes Manifests
      run: |
        sed -i "s|DOCKER_REGISTRY/DOCKER_IMAGE:BACKEND_TAG|${{ secrets.DOCKER_USERNAME }}/estate-flow-backend:${{ github.run_number }}|g" k8s/backend/backend-deployment.yaml
        sed -i "s|DOCKER_REGISTRY/DOCKER_IMAGE:FRONTEND_TAG|${{ secrets.DOCKER_USERNAME }}/estate-flow-frontend:${{ github.run_number }}|g" k8s/frontend/frontend-deployment.yaml

    - name: Deploy to Kubernetes
      env:
        KUBECONFIG: ${{ secrets.KUBECONFIG }}
      run: |
        mkdir -p ~/.kube
        echo "$KUBECONFIG" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config
        
        kubectl create namespace estate --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f k8s/secrets/db-secret.yaml
        kubectl apply -f k8s/configmaps/
        kubectl apply -f k8s/mysql/
        kubectl apply -f k8s/backend/
        kubectl apply -f k8s/frontend/
        kubectl apply -f k8s/monitoring/
